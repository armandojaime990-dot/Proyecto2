# Pipeline CI/CD: pruebas (pytest + Jest + Playwright) -> despliegue en AWS EC2
# El despliegue (conexion SSH) SOLO ocurre si todas las pruebas pasan.
# Cada ejecucion registra su resultado en OpenObserve (stream "cicd_pipeline").
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  O2_URL: ${{ secrets.O2_URL }}
  O2_USER: ${{ secrets.O2_USER }}
  O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  # ---------------------------------------------------------------- PRUEBAS
  test:
    name: Pruebas (Backend + Frontend + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Backend: pytest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias backend
        run: pip install -r backend/requirements-dev.txt
      - name: Pruebas backend (pytest)
        id: pytest
        working-directory: backend
        run: pytest --junitxml=pytest-report.xml

      # ---- Frontend: Jest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pruebas frontend (Jest)
        id: jest
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test

      # ---- E2E: levantar la app completa y probarla con Playwright
      - name: Levantar stack (db + backend + frontend)
        run: |
          cp .env.example .env
          sed -i 's/^OTEL_ENABLED=.*/OTEL_ENABLED=false/; s/^WEB_PORT=.*/WEB_PORT=8080/' .env
          docker compose up -d --build db backend frontend
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Pruebas E2E (Playwright)
        id: playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: admin@demo.com
          E2E_ADMIN_PASSWORD: Admin123!
        run: npx playwright test

      # ---- Evidencias y registro en OpenObserve (siempre)
      - name: Logs de contenedores (si fallo)
        if: failure()
        run: docker compose logs --tail=200
      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Registrar resultado de pruebas en OpenObserve
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: bash scripts/send_o2_event.sh tests "${{ job.status }}" "pytest=${PYTEST_OUTCOME} jest=${JEST_OUTCOME} playwright=${PLAYWRIGHT_OUTCOME}"

  # -------------------------------------------- DESPLIEGUE BLOQUEADO (fallo)
  deploy-blocked:
    name: Despliegue bloqueado
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar bloqueo en OpenObserve
        run: |
          echo "::error::Las pruebas fallaron: NO se abre la conexion SSH hacia AWS EC2"
          bash scripts/send_o2_event.sh deploy_blocked blocked "Pruebas fallidas: conexion SSH a EC2 bloqueada"

  # ---------------------------------------------- DESPLIEGUE (solo si pasa)
  deploy:
    name: Despliegue en AWS EC2
    needs: test
    if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar llave SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # Limpia espacios/saltos de linea y "http://" que se cuelan al pegar los Secrets
          HOST=$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')
          HOST=${HOST#http://}; HOST=${HOST#https://}; HOST=${HOST%%/*}
          USR=$(printf '%s' "$EC2_USER" | tr -d '[:space:]')
          if ! [[ "$HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El Secret EC2_HOST debe ser solo la IP (ej. 18.116.130.245). Tiene ${#HOST} caracteres."
            exit 1
          fi
          if [ "$USR" != "ubuntu" ]; then
            echo "::warning::El Secret EC2_USER no es 'ubuntu' (tiene ${#USR} caracteres). Revisalo si falla la conexion."
          fi
          echo "EC2_HOST=$HOST" >> "$GITHUB_ENV"
          echo "EC2_USER=$USR" >> "$GITHUB_ENV"
          EC2_HOST="$HOST"
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar codigo a EC2 (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/ec2.pem" ./ "$EC2_USER@$EC2_HOST:~/app/"

      - name: Actualizar contenedores en EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "cd ~/app && APP_VERSION=${GITHUB_SHA::7} docker compose --profile monitoring up -d --build --remove-orphans && docker image prune -f"

      - name: Verificar salud de la aplicacion
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://$EC2_HOST/api/health" && exit 0
            sleep 5
          done
          exit 1

      - name: Registrar despliegue en OpenObserve
        if: always()
        run: bash scripts/send_o2_event.sh deploy "${{ job.status }}" "Despliegue en EC2 version ${GITHUB_SHA::7}"
